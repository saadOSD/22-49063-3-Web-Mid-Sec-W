<!DOCTYPE html>
<html>
<head>
    <title>Login Form</title>
    <style>
        
        body { font-family: 'Times New Roman', Times, serif, sans-serif; margin: 50px; }
        table { border-collapse: collapse; }
        td { padding: 10px; }
        
      
        #error { color: red; font-weight: bold; }
        
        
        #count { color: black; font-weight: bold; }
    </style>
</head>
<body>

    <h2>Login Form Task</h2>
    <form onsubmit="return collect_data()">
        <table>
            <tr>
                <td>Email:</td>
                <td><input type="text" id="email"></td>
            </tr>
            <tr>
                <td>Password:</td>
                <td><input type="password" id="password"></td>
            </tr>
            <tr>
                <td></td>
                <td><button type="submit">Submit</button></td>
            </tr>
        </table>
    </form>

    <div id="error"></div>
    <p>Failed Attempts: <span id="count">0</span></p>

    <script src="script.js"></script>
</body>
</html>
